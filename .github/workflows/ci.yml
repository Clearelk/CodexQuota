name: CI - Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore CodexQuota.slnx -c Release

    - name: Build solution
      run: dotnet build CodexQuota.slnx -c Release --no-restore

    - name: Run tests
      run: dotnet test CodexQuota.slnx -c Release --no-build --verbosity normal
